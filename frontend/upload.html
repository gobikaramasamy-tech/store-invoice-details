<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Invoice - AI Invoice Checker</title>

    <link rel="stylesheet" href="../css/upload.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- HEADER -->
    <header class="top-header">

        <div class="logo">
            <i class="fa-solid fa-file-invoice"></i>
            AI Invoice Checker
        </div>

        <a href="dashboard.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Dashboard
        </a>

    </header>


    <!-- MAIN CONTENT -->
    <main class="upload-container">

        <div class="page-title">

            <h1>Upload Invoice</h1>

            <p>
                Upload an invoice to extract and verify its details.
            </p>

        </div>


        <!-- UPLOAD CARD -->
        <div class="upload-card">

            <div class="upload-icon">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>

            <h2>Upload your invoice</h2>

            <p>
                Drag and drop your invoice here
                or choose a file from your computer.
            </p>


            <!-- DROP AREA -->
            <div class="drop-area" id="dropArea">

                <i class="fa-solid fa-file-arrow-up"></i>

                <p>Drop your invoice here</p>

                <span>PDF, JPG or PNG</span>

                <label for="invoiceFile" class="choose-btn">
                    Choose File
                </label>

                <input
                    type="file"
                    id="invoiceFile"
                    accept=".pdf,.jpg,.jpeg,.png"
                    hidden
                >

            </div>


            <!-- SELECTED FILE -->
            <div class="selected-file" id="selectedFile">

                <div class="file-info">

                    <i class="fa-solid fa-file"></i>

                    <div>
                        <strong id="fileName">
                            No file selected
                        </strong>

                        <span id="fileSize"></span>
                    </div>

                </div>

                <button id="removeFile" class="remove-btn">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>


            <!-- CHECK BUTTON -->
            <button id="checkInvoice" class="check-btn" disabled>

                <i class="fa-solid fa-magnifying-glass"></i>

                Check Invoice

            </button>


            <p class="supported">
                Maximum file size: 10 MB
            </p>

        </div>

    </main>


    <script src="../js/upload.js"></script>

</body>
</html>
