<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invoice Preview - AI Invoice Checker</title>

    <link rel="stylesheet" href="../css/invoice-preview.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="top-header">

        <div class="logo">
            <i class="fa-solid fa-file-invoice"></i>
            AI Invoice Checker
        </div>

        <a href="dashboard.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Dashboard
        </a>

    </header>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="preview-container">

        <!-- PAGE TITLE -->

        <div class="page-title">

            <h1>Invoice Preview</h1>

            <p>
                Review the extracted invoice information before verification.
            </p>

        </div>


        <!-- ================= FILE INFORMATION ================= -->

        <div class="file-card">

            <div class="file-left">

                <div class="file-icon">
                    <i class="fa-solid fa-file-invoice"></i>
                </div>

                <div>

                    <h3 id="invoiceFileName">
                        Invoice
                    </h3>

                    <p>
                        Uploaded:
                        <span id="uploadDate">-</span>
                        <span id="uploadTime"></span>
                    </p>

                </div>

            </div>


            <span class="processing-badge">
                <i class="fa-solid fa-clock"></i>
                Ready for Review
            </span>

        </div>


        <!-- ================= INVOICE DETAILS ================= -->

        <section class="details-card">

            <div class="section-title">

                <div>

                    <h2>Invoice Details</h2>

                    <p>
                        Verify the information extracted from the invoice.
                    </p>

                </div>

            </div>


            <div class="form-grid">

                <!-- INVOICE NUMBER -->

                <div class="form-group">

                    <label for="invoiceNumber">
                        Invoice Number
                    </label>

                    <input
                        type="text"
                        id="invoiceNumber"
                        placeholder="Enter invoice number"
                        autocomplete="off">

                </div>


                <!-- VENDOR NAME -->

                <div class="form-group">

                    <label for="vendorName">
                        Vendor Name
                    </label>

                    <input
                        type="text"
                        id="vendorName"
                        placeholder="Enter vendor name"
                        autocomplete="off">

                </div>


                <!-- VENDOR GST -->

                <div class="form-group">

                    <label for="vendorGST">
                        Vendor GST
                    </label>

                    <input
                        type="text"
                        id="vendorGST"
                        placeholder="Enter GST number"
                        autocomplete="off">

                </div>


                <!-- INVOICE DATE -->

                <div class="form-group">

                    <label for="invoiceDate">
                        Invoice Date
                    </label>

                    <input
                        type="date"
                        id="invoiceDate">

                </div>


                <!-- PO NUMBER -->

                <div class="form-group">

                    <label for="poNumber">
                        PO Number
                    </label>

                    <input
                        type="text"
                        id="poNumber"
                        placeholder="Enter PO number"
                        autocomplete="off">

                </div>


                <!-- CURRENCY -->

                <div class="form-group">

                    <label for="currency">
                        Currency
                    </label>

                    <select id="currency">

                        <option value="INR">
                            INR - Indian Rupee
                        </option>

                        <option value="USD">
                            USD - US Dollar
                        </option>

                        <option value="EUR">
                            EUR - Euro
                        </option>

                    </select>

                </div>


                <!-- PAYMENT TERMS -->

                <div class="form-group full-width">

                    <label for="paymentTerms">
                        Payment Terms
                    </label>

                    <input
                        type="text"
                        id="paymentTerms"
                        placeholder="Enter payment terms"
                        autocomplete="off">

                </div>

            </div>

        </section>


        <!-- ================= AMOUNT DETAILS ================= -->

        <section class="details-card">

            <div class="section-title">

                <div>

                    <h2>Amount Details</h2>

                    <p>
                        Invoice calculation information.
                    </p>

                </div>

            </div>


            <div class="amount-grid">

                <!-- SUBTOTAL -->

                <div class="amount-item">

                    <label for="subtotal">
                        Subtotal
                    </label>

                    <div class="amount-input">

                        <span id="subtotalSymbol">₹</span>

                        <input
                            type="number"
                            id="subtotal"
                            placeholder="0"
                            step="0.01"
                            min="0">

                    </div>

                </div>


                <!-- TAX -->

                <div class="amount-item">

                    <label for="tax">
                        Tax
                    </label>

                    <div class="amount-input">

                        <span id="taxSymbol">₹</span>

                        <input
                            type="number"
                            id="tax"
                            placeholder="0"
                            step="0.01"
                            min="0">

                    </div>

                </div>


                <!-- DISCOUNT -->

                <div class="amount-item">

                    <label for="discount">
                        Discount
                    </label>

                    <div class="amount-input">

                        <span id="discountSymbol">₹</span>

                        <input
                            type="number"
                            id="discount"
                            placeholder="0"
                            step="0.01"
                            min="0">

                    </div>

                </div>


                <!-- TOTAL AMOUNT -->

                <div class="amount-item total">

                    <label for="totalAmount">
                        Total Amount
                    </label>

                    <div class="amount-input">

                        <span id="totalAmountSymbol">₹</span>

                        <input
                            type="number"
                            id="totalAmount"
                            placeholder="0"
                            step="0.01"
                            min="0">

                    </div>

                </div>

            </div>

        </section>


        <!-- ================= ACTION BUTTONS ================= -->

        <div class="action-buttons">

            <a href="upload.html" class="secondary-btn">

                <i class="fa-solid fa-arrow-left"></i>

                Upload Another

            </a>


            <button
                type="button"
                id="continueVerification"
                class="primary-btn">

                Continue to Verification

                <i class="fa-solid fa-arrow-right"></i>

            </button>

        </div>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="../js/invoice-preview.js"></script>

</body>

</html>
